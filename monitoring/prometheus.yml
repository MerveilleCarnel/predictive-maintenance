global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:

  # ── API FastAPI ─────────────────────────────────
  - job_name: "predictive-maintenance-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"

  # ── Prometheus lui-meme ─────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
